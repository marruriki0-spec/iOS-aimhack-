<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RIKI x Proxy</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #050505;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .desktop-warning {
      display: none;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .card {
      background: #0d0d0d;
      border: 1px solid #222;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 0 30px rgba(255,255,255,0.04);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 9 / 16;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      margin-bottom: 18px;
      border: 1px solid #222;
    }

    .video-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .key-title {
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
    }

    .key-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #080808;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 5px;
      margin-bottom: 12px;
    }

    #keyDisplay {
      flex: 1;
      padding: 11px;
      font-size: 14px;
      word-break: break-all;
      color: #fff;
    }

    .copy-btn {
      border: none;
      background: #fff;
      color: #000;
      border-radius: 9px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .notice {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin: 12px 0 16px;
    }

    .download-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #fff;
      color: #000;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .download-btn + .download-btn {
      margin-top: 10px;
    }

    .download-btn:hover {
      opacity: 0.9;
    }

    .download-btn:disabled {
      background: #222;
      color: #666;
      cursor: not-allowed;
    }

    .footer {
      text-align: center;
      color: #555;
      font-size: 11px;
      margin-top: 18px;
    }

    @media (min-width: 700px) {
      body {
        display: none;
      }

      .desktop-warning {
        display: flex;
        position: fixed;
        inset: 0;
        background: #050505;
        color: #fff;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 30px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="desktop-warning">
    กรุณาเปิดหน้านี้บนโทรศัพท์มือถือ
  </div>

  <div class="container">
    <div class="card">

      <div class="logo">
        RIKI x Proxy
      </div>

      <div class="subtitle">
        Mobile Version
      </div>

      <div class="video-box">
        <iframe
          src="https://www.youtube.com/embed/urEEjSVt61Q"
          title="RIKI x Proxy Tutorial"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>

      <div class="key-title">
        KEY
      </div>

      <div class="key-box">
        <div id="keyDisplay">
          กำลังตรวจสอบ Key...
        </div>

        <button class="copy-btn" onclick="copyKey()">
          COPY
        </button>
      </div>

      <div class="notice">
        กรุณาดูวิดีโอสอนติดตั้งก่อนใช้งาน
      </div>

      <button
        id="downloadBtn"
        class="download-btn"
        onclick="downloadProxy()"
        disabled>
        DOWNLOAD
      </button>

      <button
        id="happDownloadBtn"
        class="download-btn"
        onclick="downloadHapp()">
        แอพ happ
      </button>

      <div class="footer">
        RIKI x Proxy • Mobile Version
      </div>

    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const key = params.get("key");

    const keyDisplay = document.getElementById("keyDisplay");
    const downloadBtn = document.getElementById("downloadBtn");

    const DOWNLOAD_URL = "https://client.aimhack.shop";
    const HAPP_URL = "./happ.apk"; // วางไฟล์แอปที่เปลี่ยนชื่อเป็น happ.apk ไว้ในโฟลเดอร์เดียวกัน

    if (key) {
      keyDisplay.textContent = key;
      downloadBtn.disabled = false;
    } else {
      keyDisplay.textContent = "ไม่พบ Key";
      downloadBtn.disabled = true;
    }

    function copyKey() {
      if (!key) return;

      navigator.clipboard.writeText(key).then(() => {
        const btn = document.querySelector(".copy-btn");

        btn.textContent = "COPIED";

        setTimeout(() => {
          btn.textContent = "COPY";
        }, 1500);
      });
    }

    function downloadProxy() {
      if (!key) return;

      window.location.href = DOWNLOAD_URL;
    }

    function downloadHapp() {
      const link = document.createElement("a");
      link.href = HAPP_URL;
      link.download = "happ.apk";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>

</body>
</html>
